[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-agentic-search"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.1",
  "fastmcp==3.3.1",
  "litellm==1.86.1",
  "pydantic>=2.8,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "hypothesis>=6.100",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["nexus*"]

# ──────────────────────────── pytest ────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "ignore::DeprecationWarning:websockets.*",
  "ignore::DeprecationWarning:uvicorn.protocols.websockets.*",
  "ignore::DeprecationWarning:opentelemetry.*",
]
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
  "security: adversarial security tests (Spec 13)",
  "load: load / concurrency tests",
  "golden: golden-quality tests; require GOLDEN_LIVE=1 and API keys",
]

# ──────────────────────────── ruff ────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "PIE",  # misc
  "RET",  # return
  "RUF",  # ruff-specific
  "S",    # bandit
  "TID",  # tidy imports
  "PT",   # pytest style
]
ignore = [
  "E501",  # long lines — line-length handles soft cap
  "B008",  # function call in default arg (FastAPI Depends idiom)
  "S101",  # assert in source — we use it; tests obviously need it
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S105",  # hardcoded passwords (fixtures/tokens)
  "S106",  # same
  "S311",  # random for tests
]

[tool.ruff.lint.isort]
known-first-party = ["nexus"]

# ──────────────────────────── mypy ────────────────────────────
# Initial config is intentionally lenient. We tighten module-by-module
# as each spec PR lands clean. CI runs mypy advisory-only until baseline
# is green; the goal is module-level --strict over time.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = false
