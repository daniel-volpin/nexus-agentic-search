name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install Python
        run: uv python install 3.11
      - name: Install deps
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check nexus tests

  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install Python
        run: uv python install 3.11
      - name: Install deps
        run: uv sync
      - name: Run unit + security tests
        run: uv run pytest -q tests/unit tests/security --cov=nexus --cov-report=term-missing

  typecheck:
    # Blocking: nexus/ is mypy-clean. A new type error fails the PR.
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install Python
        run: uv python install 3.11
      - name: Install deps
        run: uv sync
      - name: Mypy
        run: uv run mypy nexus

  audit:
    # Dependency vulnerability scan. CVE-2025-69872 (diskcache pickle RCE)
    # is mitigated in code — we use diskcache.JSONDisk, never pickle — but
    # pip-audit still flags the version since no fixed release exists yet.
    # It is explicitly ignored here; drop the ignore once diskcache ships a
    # fix and we bump it. Any OTHER vulnerability fails the build.
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install Python
        run: uv python install 3.11
      - name: Install deps
        run: uv sync
      - name: pip-audit
        run: uv run --with pip-audit pip-audit --ignore-vuln CVE-2025-69872
