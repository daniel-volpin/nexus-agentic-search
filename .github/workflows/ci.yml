name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install Python
        run: uv python install 3.11
      - name: Install deps
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check nexus tests

  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install Python
        run: uv python install 3.11
      - name: Install deps
        run: uv sync
      - name: Run unit + security tests
        run: uv run pytest -q tests/unit tests/security --cov=nexus --cov-report=term-missing

  typecheck:
    # Blocking: nexus/ is mypy-clean. A new type error fails the PR.
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install Python
        run: uv python install 3.11
      - name: Install deps
        run: uv sync
      - name: Mypy
        run: uv run mypy nexus
